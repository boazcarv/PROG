<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Bootstrap</title>
    <!-- link do CSS do Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1 class="text-center mt-5">Login</h1>
    <form class="usuario">
        <label for="user" class="form-label">Usuário</label>
        <input type="text" class="form-control mb-3" id="user" placeholder="">
    </form>
    <form class="senha">
        <label for="password" class="form-label">Senha</label>
        <input type="password" class="form-control mb-3" id="password" placeholder="">
    </form>
    <button type="submit" class="btn btn-primary">Entrar</button>
</div>

    <!-- bootstrap JS (opcional para componentes interativos) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
